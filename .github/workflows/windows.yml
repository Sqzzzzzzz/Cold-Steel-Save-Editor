name: Windows

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -v
      - run: python build_preview.py --onefile
      - name: Package and verify the Windows build
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python package_release.py --onefile --tag "$env:GITHUB_REF_NAME"
          } else {
            python package_release.py --onefile
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python verify_package.py release/onefile --onefile --full-theme
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64
          path: |
            release/onefile/*.zip
            release/onefile/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64
          path: release/onefile
      - name: Create a draft release with the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath release/onefile -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 2) { throw 'Expected one archive and its SHA256SUMS.txt.' }
          gh release create "$env:GITHUB_REF_NAME" @assets --draft --verify-tag --title "Cold Steel I Inventory Editor $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
